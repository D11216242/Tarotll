<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>塔羅抽牌</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft JhengHei", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .content {
            padding: 30px;
        }

        .controls {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
            font-size: 1.05em;
        }

        .spread-options {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .spread-option {
            flex: 1;
            min-width: 150px;
        }

        .spread-option input[type="radio"] {
            display: none;
        }

        .spread-option label {
            display: block;
            padding: 15px;
            background: white;
            border: 2px solid #ddd;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s;
        }

        .spread-option input[type="radio"]:checked + label {
            border-color: #667eea;
            background: #667eea;
            color: white;
            font-weight: 600;
        }

        .spread-option label:hover {
            border-color: #667eea;
            transform: translateY(-2px);
        }

        textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            font-family: inherit;
            resize: vertical;
            min-height: 80px;
            transition: border-color 0.3s;
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            background: white;
            cursor: pointer;
            transition: border-color 0.3s;
        }

        select:focus {
            outline: none;
            border-color: #667eea;
        }

        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }

        button {
            flex: 1;
            padding: 15px 30px;
            font-size: 1.1em;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
            transform: translateY(-2px);
        }

        .coach-text {
            background: #e7f3ff;
            border-left: 4px solid #667eea;
            padding: 15px;
            margin-bottom: 30px;
            border-radius: 5px;
        }

        .coach-text h3 {
            color: #667eea;
            margin-bottom: 10px;
        }

        .coach-text ul {
            margin-left: 20px;
        }

        .coach-text li {
            margin-bottom: 5px;
        }

        .results {
            display: none;
        }

        .results.active {
            display: block;
        }

        .results-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .results-header h2 {
            color: #667eea;
            font-size: 2em;
            margin-bottom: 10px;
        }

        .question-display {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }

        .question-display strong {
            color: #667eea;
        }

        .cards-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            border: 2px solid #ddd;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }

        .card-position {
            font-size: 0.9em;
            color: #667eea;
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .card-name {
            font-size: 1.5em;
            font-weight: 700;
            margin-bottom: 8px;
            color: #333;
        }

        .card-orientation {
            display: inline-block;
            padding: 4px 12px;
            background: #667eea;
            color: white;
            border-radius: 15px;
            font-size: 0.85em;
            margin-bottom: 12px;
        }

        .card-orientation.reversed {
            background: #dc3545;
        }

        .card-description {
            color: #555;
            line-height: 1.8;
        }

        footer {
            background: #f8f9fa;
            padding: 20px;
            text-align: center;
            color: #666;
            font-size: 0.9em;
        }

        footer strong {
            color: #dc3545;
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 2em;
            }

            .content {
                padding: 20px;
            }

            .spread-options {
                flex-direction: column;
            }

            .button-group {
                flex-direction: column;
            }

            .cards-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🔮 塔羅抽牌</h1>
            <p>單檔示範版 - 自我探索與學習工具</p>
        </header>

        <div class="content">
            <div class="controls">
                <div class="form-group">
                    <label>選擇牌陣：</label>
                    <div class="spread-options">
                        <div class="spread-option">
                            <input type="radio" id="spread-1" name="spread" value="1" checked>
                            <label for="spread-1">
                                <div>單張牌</div>
                                <small>今日提醒</small>
                            </label>
                        </div>
                        <div class="spread-option">
                            <input type="radio" id="spread-3" name="spread" value="3">
                            <label for="spread-3">
                                <div>三張牌</div>
                                <small>過去/現在/未來</small>
                            </label>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="question">你的問題（選填）：</label>
                    <textarea id="question" placeholder="例如：未來一個月我在工作上可以如何提升？"></textarea>
                </div>

                <div class="form-group">
                    <label for="reversed-rate">正逆位機率：</label>
                    <select id="reversed-rate">
                        <option value="0">0% - 全正位</option>
                        <option value="0.5" selected>50% - 隨機</option>
                        <option value="1">100% - 全逆位</option>
                    </select>
                </div>

                <div class="button-group">
                    <button class="btn-primary" onclick="drawCards()">🎴 抽牌</button>
                    <button class="btn-secondary" onclick="resetReading()">🔄 再抽一次</button>
                </div>
            </div>

            <div class="coach-text">
                <h3>💡 問問題的小建議</h3>
                <ul>
                    <li>將「會不會」的問題改為「我可以怎麼做」，讓答案更具行動指引</li>
                    <li>加上時間範圍（例如：未來一個月），讓解讀更聚焦</li>
                    <li>保持開放心態，塔羅是自我探索的工具，而非絕對預言</li>
                </ul>
            </div>

            <div class="results" id="results">
                <div class="results-header">
                    <h2>✨ 抽牌結果</h2>
                    <div class="question-display" id="question-display"></div>
                </div>
                <div class="cards-container" id="cards-container"></div>
            </div>
        </div>

        <footer>
            <strong>⚠️ 免責聲明：</strong>本工具用於自我探索與學習，不構成醫療、法律、投資或專業建議。
        </footer>
    </div>

        // 牌陣定義
        const SPREADS = {
            1: ["今日提醒"],
            3: ["過去", "現在", "未來"]
        };

        // Fisher-Yates 洗牌演算法
        function shuffleDeck(deck) {
            const shuffled = [...deck];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        // 抽牌函數
        function drawCards() {
            // 檢查牌堆是否完整（開發期警告）
            if (CARDS.length !== 78) {
                console.warn(`警告：牌堆不完整，目前有 ${CARDS.length} 張牌，應為 78 張`);
            }

            // 取得選擇的牌陣
            const spreadSelect = document.querySelector('input[name="spread"]:checked');
            const spreadCount = parseInt(spreadSelect.value);
            const positions = SPREADS[spreadCount];

            // 取得問題
            const question = document.getElementById('question').value.trim();

            // 取得正逆位機率
            const reversedRate = parseFloat(document.getElementById('reversed-rate').value);

            // 洗牌並抽取
            const shuffled = shuffleDeck(CARDS);
            const drawnCards = shuffled.slice(0, spreadCount);

            // 為每張牌決定正逆位
            const results = drawnCards.map((card, index) => {
                const isReversed = Math.random() < reversedRate;
                return {
                    position: positions[index],
                    card: card,
                    isReversed: isReversed
                };
            });

            // 顯示結果
            displayResults(results, question);
        }

        // 顯示結果
        function displayResults(results, question) {
            const resultsDiv = document.getElementById('results');
            const questionDisplay = document.getElementById('question-display');
            const cardsContainer = document.getElementById('cards-container');

            // 顯示問題
            if (question) {
                questionDisplay.innerHTML = `<strong>你的問題：</strong>${escapeHtml(question)}`;
                questionDisplay.style.display = 'block';
            } else {
                questionDisplay.innerHTML = '<em>（未填寫問題）</em>';
                questionDisplay.style.display = 'block';
            }

            // 清空並重建卡片
            cardsContainer.innerHTML = '';
            results.forEach(result => {
                const cardElement = createCardElement(result);
                cardsContainer.appendChild(cardElement);
            });

            // 顯示結果區域
            resultsDiv.classList.add('active');

            // 平滑滾動到結果
            resultsDiv.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        // 建立卡片元素
        function createCardElement(result) {
            const card = document.createElement('div');
            card.className = 'card';

            const position = document.createElement('div');
            position.className = 'card-position';
            position.textContent = result.position;

            const name = document.createElement('div');
            name.className = 'card-name';
            name.textContent = result.card.name;

            const orientation = document.createElement('span');
            orientation.className = result.isReversed ? 'card-orientation reversed' : 'card-orientation';
            orientation.textContent = result.isReversed ? '逆位' : '正位';

            const description = document.createElement('div');
            description.className = 'card-description';
            description.textContent = result.isReversed ? result.card.reversed : result.card.upright;

            card.appendChild(position);
            card.appendChild(name);
            card.appendChild(orientation);
            card.appendChild(description);

            return card;
        }

        // 重置抽牌
        function resetReading() {
            const resultsDiv = document.getElementById('results');
            resultsDiv.classList.remove('active');
            document.getElementById('question').value = '';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // HTML 跳脫函數（安全性）
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // 頁面載入時的初始化
        document.addEventListener('DOMContentLoaded', function() {
            console.log('塔羅抽牌應用已載入');
            console.log(`牌堆包含 ${CARDS.length} 張牌`);
        });
